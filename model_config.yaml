  - {gw_from: 2,  gw_to: 3,  historical: 0.80, current: 0.20}
  - {gw_from: 4,  gw_to: 5,  historical: 0.60, current: 0.40}
  - {gw_from: 6,  gw_to: 8,  historical: 0.45, current: 0.55}
  - {gw_from: 9,  gw_to: 12, historical: 0.30, current: 0.70}
