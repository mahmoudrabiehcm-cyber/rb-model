# -----------------------------------------------------------------------------
# 1. Core formula position multipliers
# xPts = xM * [2 + npxG*GoalPts + xA*3 + CS%*CSPts + P_defcon*2 + xBonus] - DiscCost
# -----------------------------------------------------------------------------
position_multipliers:
  GK:
    goal_pts: 6
    assist_pts: 3
    clean_sheet_pts: 4
    defcon_threshold: 10   # CBIT actions
  DEF:
    goal_pts: 6
    assist_pts: 3
    clean_sheet_pts: 4
    defcon_threshold: 10
  MID:
    goal_pts: 5
    assist_pts: 3
    clean_sheet_pts: 1
    defcon_threshold: 12   # CBIRT actions
  FWD:
    goal_pts: 4
    assist_pts: 3
    clean_sheet_pts: 0
    defcon_threshold: null   # no DEFCON pts for forwards

disc_cost: 0.05   # expected value lost to cards, constant per Core Formula

# -----------------------------------------------------------------------------
# DEFCON probability — CALIBRATED curve (v2.4).
# Interpolate linearly between DC90 buckets; clamp outside range [0, last].
# -----------------------------------------------------------------------------
defcon_calibration:
  DEF:        # threshold 10 CBIT
    - {dc90: 0,  p: 0.00}
    - {dc90: 3,  p: 0.00}
    - {dc90: 5,  p: 0.052}
    - {dc90: 7,  p: 0.176}
    - {dc90: 9,  p: 0.398}
    - {dc90: 11, p: 0.589}
    - {dc90: 13, p: 0.650}
  MID_FWD:    # threshold 12 CBIRT (used for MID; FWD gets no DEFCON pts)
    - {dc90: 0,  p: 0.000}
    - {dc90: 3,  p: 0.000}
    - {dc90: 5,  p: 0.007}
    - {dc90: 7,  p: 0.057}
    - {dc90: 9,  p: 0.176}
    - {dc90: 11, p: 0.349}
    - {dc90: 13, p: 0.548}

# -----------------------------------------------------------------------------
# BPS Profile Multiplier — 2026/27 BPS calculation change adjustment
# xBonus_adjusted = xBonus_historical * multiplier
# Tag players in manual_overrides.csv with a "bps_profile" value matching a key
# below. Untagged players default to "default".
# -----------------------------------------------------------------------------
bps_profile_multiplier:
  high_dribble_winger_or_attacking_fb: 1.06
  high_cbi_cb_or_defensive_mid: 0.95
  default: 1.00

# -----------------------------------------------------------------------------
# 3b. Competition-load discount. Maintain the European-competition team list
# each season/round -- this is NOT derivable from the domestic fixtures CSV.
# -----------------------------------------------------------------------------
competition_load_discount:
  champions_league: 0.97
  europa_league: 0.95
  conference_league: 0.95
  domestic_only: 1.00

european_competition_teams:
  # short_name (from teams.csv) -> competition key above. Update weekly from
  # UEFA fixture congestion (a team only takes the discount in gameweeks
  # adjacent to a midweek European tie).
  champions_league: []      # e.g. ["ARS", "LIV", "MCI"]
  europa_league: []         # e.g. ["AVL"]
  conference_league: []     # e.g. ["CRY"]

# -----------------------------------------------------------------------------
# 5. Decay Schedule (v6.0 / Standing Rule #38 -- METRIC-SPECIFIC, replaces the
# single shared curve used through v5.0). Each output rate now has its own
# historical/current blend curve, keyed off how fast that rate's YoY signal
# actually stabilizes:
#   - npxg: accelerated. Sourced to StatsBomb's Pugsley repeatability study
#     (shots/90 YoY R^2=0.435 vs goals/90 R^2=0.048) and American Soccer
#     Analysis (team xG signal significant from ~4 matches).
#   - xa: moderately accelerated -- one step more conservative than npxg.
#   - dc: UNCHANGED from the pre-v6.0 shared curve. No published
#     stabilization research exists for defensive-action counting stats, so
#     Rule #4 (EST/VERIFIED discipline) blocks accelerating it without
#     evidence. Still tagged EST/unresolved per the doc.
# Rule #38 also specifies: a future metric added WITHOUT its own sourced
# curve must default to the MOST conservative (slowest) of these three, never
# the fastest, until evidenced -- keep that in mind before adding a 4th table.
# NOTE: DEFCON's per-band "manager-fit cap" (+/-20% -> 0%, per the doc) is
# NOT implemented here or anywhere in the engine yet -- pre-existing gap,
# explicitly out of scope for Patch 18, tracked as a separate follow-up.
# -----------------------------------------------------------------------------
decay_schedule_npxg:
