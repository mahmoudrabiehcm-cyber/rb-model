# -----------------------------------------------------------------------------
# 1. Core formula position multipliers
# xPts = xM * [2 + npxG*GoalPts + xA*3 + CS%*CSPts + P_defcon*2 + xBonus] - DiscCost
# -----------------------------------------------------------------------------
position_multipliers:
  GK:
    goal_pts: 6
    assist_pts: 3
    clean_sheet_pts: 4
    defcon_threshold: 10   # CBIT actions
  DEF:
    goal_pts: 6
    assist_pts: 3
    clean_sheet_pts: 4
    defcon_threshold: 10
  MID:
    goal_pts: 5
    assist_pts: 3
    clean_sheet_pts: 1
    defcon_threshold: 12   # CBIRT actions
  FWD:
    goal_pts: 4
    assist_pts: 3
    clean_sheet_pts: 0
    defcon_threshold: null   # no DEFCON pts for forwards

disc_cost: 0.05   # expected value lost to cards, constant per Core Formula

# -----------------------------------------------------------------------------
# DEFCON probability — CALIBRATED curve (v2.4).
# Interpolate linearly between DC90 buckets; clamp outside range [0, last].
# -----------------------------------------------------------------------------
defcon_calibration:
  DEF:        # threshold 10 CBIT
    - {dc90: 0,  p: 0.00}
    - {dc90: 3,  p: 0.00}
    - {dc90: 5,  p: 0.052}
    - {dc90: 7,  p: 0.176}
    - {dc90: 9,  p: 0.398}
    - {dc90: 11, p: 0.589}
    - {dc90: 13, p: 0.650}
  MID_FWD:    # threshold 12 CBIRT (used for MID; FWD gets no DEFCON pts)
    - {dc90: 0,  p: 0.000}
    - {dc90: 3,  p: 0.000}
    - {dc90: 5,  p: 0.007}
    - {dc90: 7,  p: 0.057}
    - {dc90: 9,  p: 0.176}
    - {dc90: 11, p: 0.349}
    - {dc90: 13, p: 0.548}

# -----------------------------------------------------------------------------
# BPS Profile Multiplier — 2026/27 BPS calculation change adjustment
# xBonus_adjusted = xBonus_historical * multiplier
# Tag players in manual_overrides.csv with a "bps_profile" value matching a key
# below. Untagged players default to "default".
# -----------------------------------------------------------------------------
bps_profile_multiplier:
  high_dribble_winger_or_attacking_fb: 1.06
  high_cbi_cb_or_defensive_mid: 0.95
  default: 1.00

# -----------------------------------------------------------------------------
# 3b. Competition-load discount. Maintain the European-competition team list
# each season/round -- this is NOT derivable from the domestic fixtures CSV.
# -----------------------------------------------------------------------------
competition_load_discount:
  champions_league: 0.97
  europa_league: 0.95
  conference_league: 0.95
  domestic_only: 1.00

european_competition_teams:
  # short_name (from teams.csv) -> competition key above. Update weekly from
  # UEFA fixture congestion (a team only takes the discount in gameweeks
  # adjacent to a midweek European tie).
  champions_league: []      # e.g. ["ARS", "LIV", "MCI"]
  europa_league: []         # e.g. ["AVL"]
  conference_league: []     # e.g. ["CRY"]

# -----------------------------------------------------------------------------
# 5. Decay Schedule (v6.0 / Standing Rule #38 -- METRIC-SPECIFIC, replaces the
# single shared curve used through v5.0). Each output rate now has its own
# historical/current blend curve, keyed off how fast that rate's YoY signal
# actually stabilizes:
#   - npxg: accelerated. Sourced to StatsBomb's Pugsley repeatability study
#     (shots/90 YoY R^2=0.435 vs goals/90 R^2=0.048) and American Soccer
#     Analysis (team xG signal significant from ~4 matches).
#   - xa: moderately accelerated -- one step more conservative than npxg.
#   - dc: UNCHANGED from the pre-v6.0 shared curve. No published
#     stabilization research exists for defensive-action counting stats, so
#     Rule #4 (EST/VERIFIED discipline) blocks accelerating it without
#     evidence. Still tagged EST/unresolved per the doc.
# Rule #38 also specifies: a future metric added WITHOUT its own sourced
# curve must default to the MOST conservative (slowest) of these three, never
# the fastest, until evidenced -- keep that in mind before adding a 4th table.
# NOTE: DEFCON's per-band "manager-fit cap" (+/-20% -> 0%, per the doc) is
# NOT implemented here or anywhere in the engine yet -- pre-existing gap,
# explicitly out of scope for Patch 18, tracked as a separate follow-up.
# -----------------------------------------------------------------------------
decay_schedule_npxg:
  # gw_from, gw_to (inclusive), historical_weight, current_weight
  - {gw_from: 1,  gw_to: 1,  historical: 0.90, current: 0.10}
  - {gw_from: 2,  gw_to: 3,  historical: 0.70, current: 0.30}
  - {gw_from: 4,  gw_to: 5,  historical: 0.50, current: 0.50}
  - {gw_from: 6,  gw_to: 8,  historical: 0.35, current: 0.65}
  - {gw_from: 9,  gw_to: 12, historical: 0.20, current: 0.80}
  - {gw_from: 13, gw_to: 38, historical: 0.12, current: 0.88}

decay_schedule_xa:
  - {gw_from: 1,  gw_to: 1,  historical: 1.00, current: 0.00}
  - {gw_from: 2,  gw_to: 3,  historical: 0.80, current: 0.20}
  - {gw_from: 4,  gw_to: 5,  historical: 0.60, current: 0.40}
  - {gw_from: 6,  gw_to: 8,  historical: 0.45, current: 0.55}
  - {gw_from: 9,  gw_to: 12, historical: 0.30, current: 0.70}
  - {gw_from: 13, gw_to: 38, historical: 0.15, current: 0.85}

decay_schedule_dc:
  # Unchanged from the pre-v6.0 shared curve (Standing Rule #38 leaves
  # DEFCON un-accelerated -- see note above).
  - {gw_from: 1,  gw_to: 1,  historical: 1.00, current: 0.00}
  - {gw_from: 2,  gw_to: 3,  historical: 0.85, current: 0.15}
  - {gw_from: 4,  gw_to: 5,  historical: 0.70, current: 0.30}
  - {gw_from: 6,  gw_to: 8,  historical: 0.45, current: 0.55}
  - {gw_from: 9,  gw_to: 12, historical: 0.25, current: 0.75}
  - {gw_from: 13, gw_to: 38, historical: 0.15, current: 0.85}

# -----------------------------------------------------------------------------
# CS% source hierarchy fallback order (Step 3 / §3). The engine always
# computes tier "MODEL_POISSON" for free from official team strength ratings.
# Paste a higher-tier number into manual_overrides.csv's cs_pct_override
# column (sourced by Claude via WebSearch from oddschecker.com /
# soccerstats.com) to promote a specific fixture to VERIFIED / tier-2/3.
# -----------------------------------------------------------------------------
cs_source_hierarchy:
  - {tier: 2, name: "oddschecker.com match-winner odds -> Poisson CS%", mode: "manual_paste"}
  - {tier: 3, name: "soccerstats.com clean-sheet data",                  mode: "manual_paste"}
  - {tier: 5, name: "MODEL_POISSON (FPL team strength ratings)",         mode: "automatic"}

# -----------------------------------------------------------------------------
# xM estimation heuristic thresholds (proxy for Step 4's Role Multiplier /
# xM Floor Rule until a human/Claude overrides via manual_overrides.csv)
# -----------------------------------------------------------------------------
data_quality:
  # Standing Rule #21 / Step 2b — a per-90 rate built on a tiny sample must
  # be discarded, never used as-is (the "Dasilva bug": a 2-minute cameo
  # annualized into a fabricated npxG/90 of 3.6). Any historical or
  # current-season leg with fewer minutes than this is zeroed out and
  # flagged `est_rescue_needed` instead of feeding the formula raw.
  # External Data Rescue (Step 2b) = populate manual_overrides.csv for that
  # player's code once a real external rate (Understat/FBref/etc.) is found.
  min_sample_minutes: 270   # ~3 full matches

xm_heuristic:
  confirmed_current_season_start_floor: 0.88   # Step 4 "xM Floor Rule"
  max_xm: 0.95
  unavailable_statuses: ["i", "u", "s", "n"]    # injured/unavailable/suspended/not-in-squad
  doubtful_status_multiplier_applies: true      # scale by chance_of_playing_next_round
  recency_window_gws: 4   # Patch 14 -- Standing Rule #19 (Bench GK Verification) support.
                           # The confirmed-start xM floor above now also requires a start
                           # within this many recently-played gameweeks (not just ANY start
                           # this season) -- see fpl_data.fetch_recent_start_ids and
                           # fpl_engine.estimate_xm. Raise this if the model is being too
                           # aggressive about dropping a floor for a player who's just had a
                           # short run of rest/rotation; lower it to require even fresher evidence.

# -----------------------------------------------------------------------------
# Step 7a — Transfer Path Optimization
# -----------------------------------------------------------------------------
transfer:
  horizon_gameweeks: 4          # Horizon N = 3-4 GWs per Step 7a (RB Model's UI defaults its
                                 # slider to 1 GW instead -- see app.py -- this value still
                                 # governs the CLI tool and anything else that reads config directly)
  hit_cost_per_transfer: 4
  hit_justification_threshold: 6.0   # Standing Rule #13
  # Free-Transfer Materiality Rule (v4.0 addition, not yet in the changelog doc --
  # flag this to the manager before treating it as settled model methodology).
  # A free transfer has a real opportunity cost (banked flexibility, squad
  # stability) even though it costs 0 points, so it should clear the same kind
  # of bar a paid transfer does -- just a lower one. Below this horizon-xPts
  # gain, the model recommends "Roll" instead of spending a free transfer on
  # a marginal upgrade.
  # Raised 1.5 -> 2.0 (manager-directed, Patch 7): brings this bar in line
  # with Standing Rule #34's own margin-of-error floor (2.0 xPts) instead of
  # sitting below it -- a materiality bar lower than the model's own noise
  # floor could otherwise "pass" a gain that Rule #34 was always going to
  # roll back anyway, which is exactly the confusion a 1.5 bar produced.
  minimum_meaningful_gain_free: 2.0
  # Bench Value Rule applied to the materiality check (Standing Rule #12, same
  # rule the doc's own "worked failure" example calls out for never actually
  # being wired into a solver's scoring). A swap whose OUT player is currently
  # a bench slot is discounted toward its real, autosub-weighted value before
  # comparing to the bar above -- a big raw xPts gap on a player who mostly
  # doesn't play barely moves your actual score. This is a flat approximation
  # of P(autosub), not a true per-gameweek autosub-probability model (that
  # would need to know the rest of the bench's own xM too) -- disclosed
  # simplification, not the full rule.
  # LEGACY / SUPERSEDED (Patch 5): the flat 0.2 discount above is no longer
  # read by the live code path. Rule #12 is now implemented properly in
  # optimizer.realized_gw_value()/realized_horizon_value() as a two-factor
  # heuristic (position-group minutes exposure x bench-order decay) instead
  # of one flat number applied to every bench slot alike. Key left in place,
  # same pattern as captaincy.shortlist_xpts_window below.
  bench_autosub_discount: 0.2
  # Rule #12 (Bench Value Rule) heuristic parameters (Patch 5). Disclosed
  # EST, not a full per-fixture autosub model — flagged as revisable once
  # real per-gameweek autosub outcome data exists for this season.
  # bench_order_decay: P(autosub) multiplier by outfield bench-order rank
  # (index 0 = the highest-projected outfield reserve this GW, i.e. "1st
  # reserve"). An autosub chain rarely reaches past the first one or two
  # reserves, so probability decays fast down the bench.
  bench_order_decay: [1.0, 0.55, 0.30, 0.15]
  # bench_gk_autosub_prob: fixed floor for the backup goalkeeper specifically
  # (there is only ever one starting GK, and a club's own #1 missing a match
  # entirely is rare — this is NOT the outfield exposure formula).
  bench_gk_autosub_prob: 0.05
  # Patch 37 (manager report, 2026-09-14: "the weight of the bench and auto
  # subs shouldn't be that much" for a transfer's net-gain math, "especially
  # if we are not planning for the bench boost soon"): scales DOWN just the
  # bench-autosub component of a transfer's net gain in
  # recommend.suggest_transfers()/plan_transfer_schedule()/
  # evaluate_target_transfer()/realistic_baseline_value() to near-zero, so a
  # stronger bench alone can no longer carry a marginal transfer over the
  # materiality bar — a transfer must win almost entirely on the direct
  # starting-XI swap it causes. Overridden back to a full 1.0 for the one
  # specific GW a Bench Boost play-verdict falls on (bb_play_gw) — full bench
  # value genuinely counts that week. Does NOT apply to
  # optimizer.realized_gw_value()/realized_horizon_value()'s OTHER callers
  # (chip_protocol.py's Wildcard-trigger/rebuild-vs-hold comparisons, §1a
  # Team Rating %) — those are whole-squad ongoing-quality assessments, not a
  # specific transfer's marginal net gain, and keep full bench weight.
  bench_weight_non_bb_gw: 0.08
  # How many gameweeks ahead to look when checking whether a Wildcard/Free
  # Hit is coming up soon enough that banking a transfer for it beats
  # spending it on an incremental swap now.
  chip_lookahead_gameweeks: 3

# -----------------------------------------------------------------------------
# Step 8 — Captaincy Protocol
# -----------------------------------------------------------------------------
captaincy:
  # LIVE AGAIN (Patch 9, reversing Patch 3's substitution). Step 8's own
  # documented text: "any starter within ~1.0 xPts of the squad's highest
  # single-GW projection — treat as statistically tied." Patch 3 replaced
  # this fixed figure with the general Rule #34 margin-of-error formula
  # (floor 2.0), reasoning it should scale with the top score — but that
  # made the shortlist window twice as wide as the model actually specifies,
  # and it produced a confirmed wrong call in practice: two candidates 2.0
  # xPts apart (Bruno 6.0 vs Foden 4.0, a real, meaningful gap) were called
  # a "coin-flip." Reverted to follow Step 8 as written.
  shortlist_xpts_window: 1.0
  # A candidate within (shortlist_xpts_window x this multiplier) of the top
  # score, but outside the shortlist itself, is flagged `near_miss` — used
  # as the alt-captain fallback pool on a clear-standout week where the real
  # shortlist has no second member.
  near_miss_multiplier: 2.0
  # Patch 27 (v6.3 / Standing Rule #40, 2026-09-10) — Team-Stability
  # Captaincy Check thresholds. The doc names the two signals (league
  # position; controlled vs. repeated late-rescue results) but gives no
  # numeric gap, so these are a disclosed, manager-directed EST extension
  # -- same pattern as chip_advisor_thresholds below. Only acts as a
  # tiebreak among an ALREADY-TIED shortlist (fpl_engine.team_stability_tiebreak).
  # team_stability_position_gap: league-table places apart before position
  # alone settles the tie (out of a 20-team league).
  team_stability_position_gap: 6
  # team_stability_grind_gap: gap in close_margin_share (fraction of a
  # team's played matches decided by <=1 goal or drawn) before that signal
  # settles the tie. This is a disclosed APPROXIMATION of "controlled vs.
  # repeated late rescues" -- the official fixtures data has final scores
  # only, no goal-minute data, so a literal comeback/rescue can't be
  # detected mechanically. See fpl_engine.team_league_table's docstring.
  team_stability_grind_gap: 0.25
  eo_tiers:
    contrarian_max: 40
    mixed_max: 70
    # >70 = rank-neutral

# -----------------------------------------------------------------------------
# Squad optimizer constraints (Step 7)
# -----------------------------------------------------------------------------
squad_rules:
  budget: 100.0
  squad_size: 15
  formation: {GK: 2, DEF: 5, MID: 5, FWD: 3}
  max_per_club: 3
  bench_value_rule: true   # P(autosub) x points, not full xPts, for bench slots

# -----------------------------------------------------------------------------
# Step 3c — Set-Piece Role Signal (v4.0, new). See setpiece.py for the
# decay-out mechanism. Tagged EST until real 2026/27 conversion data exists
# to replace these ranges with an observed rate (same standard as the BPS
# Profile Multiplier above).
# -----------------------------------------------------------------------------
setpiece_signal:
  enabled: true
  penalty_multiplier_max: 1.15     # range per v4.0 doc: 1.10-1.20, midpoint default
  dead_ball_multiplier_max: 1.075  # range per v4.0 doc: 1.05-1.10, midpoint default

# -----------------------------------------------------------------------------
# Step 9 — Chip Timing Protocol (v4.0, new). Thresholds for surfacing a
# Bench Boost / Triple Captain / Free Hit note against a confirmed DGW/BGW —
# see chip_protocol.py. Wildcard's TRIGGER condition is mechanical since
# Patch 30 (see wildcard_trigger: below) — what stays a manager call is only
# which single GW to actually play it on (Standing Rule #32).
# -----------------------------------------------------------------------------
chip_timing:
  bench_boost_min_double_exposure_frac: 0.25   # >= this fraction of your 15 in a double
  free_hit_min_blank_exposure_frac: 0.35        # >= this fraction of your 15 in a blank
  # LEGACY / SUPERSEDED (Patch 30) — these two drove the old pre-v6.4
  # rank-decline/flagged-player-count Wildcard heuristic, replaced by
  # wildcard_trigger: below. Left in place, same pattern as
  # transfer.bench_autosub_discount above; no longer read by the live
  # code path (wildcard_trigger_flag() uses rank history only as
  # supplementary color text now, not a trigger input).
  wildcard_flag_rank_decline_gws: 2             # consecutive worsening GWs to flag
  wildcard_flag_min_flagged_players: 3          # squad players with a status/data flag

# -----------------------------------------------------------------------------
# Wildcard trigger (Patch 30 / v6.4) — see fpl_engine.wildcard_trigger_check().
# DISCLOSURE: unlike chip_advisor_thresholds/chip_shape_test above, these two
# numbers ARE the doc's own stated figures (v6.4: "average Team Rating %
# across that horizon below ~78-80%, or a cumulative xPts gap of ~15+
# points"), not a manager-directed extension — the "~" in the doc's own text
# is why a single value stands in for each stated range/floor.
#   - team_rating_pct_ceiling: midpoint of the doc's "~78-80%" band.
#   - cumulative_gap_threshold: the doc's own "~15+" floor.
# detection_window_gws is shared with chip_shape_test above (both come from
# the same "Wildcard — detection and build horizons (v6.4)" 3-4 GW figure).
# -----------------------------------------------------------------------------
wildcard_trigger:
  team_rating_pct_ceiling: 79.0
  cumulative_gap_threshold: 15.0

# -----------------------------------------------------------------------------
# Standing Rule #34 — Margin-of-Error Tie Rule (v4.6, wired in Patch 1). A
# cumulative xPts difference smaller than max(floor_points, pct_of_total *
# the compared total) is reported as a statistical tie, not a clear winner —
# based on demonstrated single-player weekly correction noise of 3-9 points.
# Shared by the Team Rating % headline, the Chip Advisor's Bench Boost/
# Triple Captain/Free Hit play-vs-hold verdicts, and (Patch 2) the
# captaincy shortlist window.
# -----------------------------------------------------------------------------
margin_of_error:
  floor_points: 2.0
  pct_of_total: 0.02

# -----------------------------------------------------------------------------
# Chip Advisor thresholds (Patch 5) — chip-specific margin-of-error bands for
# the Bench Boost / Triple Captain / Free Hit play-vs-hold verdicts, replacing
# the single generic Standing Rule #34 band those verdicts used before.
#
# DISCLOSURE: the model doc's Rule #34 defines exactly ONE blanket formula
# (max(2.0, 2%)) and does not itself specify separate numbers per chip — this
# section is a manager-directed extension on top of the documented rule, not
# something sourced from the doc itself. Any chip key left out of this
# section falls back to the generic `margin_of_error` band above.
#
# Reasoning behind the starting values (all open to revision as real
# in-season chip outcomes accumulate):
#   - triple_captain (5.0 / 8%, manager-confirmed): rests on a SINGLE
#     player's SINGLE week — the model's own demonstrated single-player
#     weekly correction noise (3-9 points) hits this verdict hardest of the
#     three, so it gets the widest band.
#   - bench_boost (3.0 / 5%): rests on 4 players' SUMMED projection —
#     averaging across 4 independent players' noise partially cancels out
#     relative to a single-player bet, and an unused Bench Boost costs
#     nothing extra next week (the chip just stays available), so a smaller
#     bump above the generic band is enough.
#   - free_hit (6.0 / 6%): a full 15-man rebuild for one gameweek — the chip
#     itself is burned regardless of outcome once played (Step 8b), so a
#     wrong "play" call is the most costly mistake of the three even though
#     the compared total (a full squad) is larger and so a given percentage
#     already yields a bigger absolute number.
# -----------------------------------------------------------------------------
chip_advisor_thresholds:
  bench_boost: {floor_points: 3.0, pct_of_total: 0.05}
  triple_captain: {floor_points: 5.0, pct_of_total: 0.08}
  free_hit: {floor_points: 6.0, pct_of_total: 0.06}

# -----------------------------------------------------------------------------
# Step 8c shape-test (Patch 28 / v6.4) — see chip_protocol.wildcard_freehit_
# shape_test(). DISCLOSURE: the doc specifies the shape-test PROCEDURE
# (compare each detection-window GW's standalone optimal squad against the
# current squad) but no numeric overlap threshold for "structural" vs.
# "spike" — both values below are a manager-directed extension, not sourced
# from the doc itself, exactly like chip_advisor_thresholds above.
#   - structural_overlap_ceiling: a GW's optimal-squad/current-squad overlap
#     (shared player codes / 15) AT OR BELOW this counts as "meaningfully
#     diverged" that week. 0.7 -> at most ~10-11 of your current 15 players
#     appear in that week's true optimal squad.
#   - spike_overlap_floor: for a GW to be classified a REVERTING spike (Free
#     Hit-shaped) rather than part of a persistent gap (Wildcard-shaped), the
#     OTHER weeks in the detection window must sit at/above this overlap —
#     i.e. genuinely close to the current squad the rest of the time.
# detection_window_gws mirrors the doc's own "Wildcard — detection and build
# horizons (v6.4)" 3-4 GW figure; used by app.py to size the window it feeds
# into the shape-test.
# -----------------------------------------------------------------------------
chip_shape_test:
  detection_window_gws: 4

# -----------------------------------------------------------------------------
# Chip Advisor search window (Patch 32, 2026-09-14 manager report: the Bench
# Boost/Triple Captain/Free Hit "which GW" verdicts were being scanned across
# the sidebar's transfer-planning Horizon slider (1-6 GWs, defaults to 1) --
# at horizon=1 there is only ever one candidate GW, so a "PLAY GW{n}" verdict
# wasn't actually finding an optimal week, just confirming the sole option.
# That slider is for transfer decisions and stays exactly as-is; the Chip
# Advisor now scans its OWN independent window, sized here, same disclosed-
# EST-extension pattern as chip_advisor_thresholds/chip_shape_test above (the
# doc specifies the play/hold PROCEDURE via Rule #34 but no window length).
#   - default_gws: the base scan length from the current planning GW.
#   - max_extend_gws: if a confirmed Double or Blank gameweek (chip_protocol.
#     dgw_bgw_flags(), already used elsewhere for advisory notes) falls just
#     past the default window, the window auto-extends to include it -- a DGW
#     is definitionally the best Bench Boost/Triple Captain week and a BGW
#     the biggest Free Hit case, so stopping short of a known one would blind
#     the advisor to the actual optimal GW. This caps how far that extension
#     can reach, since Free Hit's verdict requires one full MILP squad
#     rebuild solve per candidate GW in the window.
# -----------------------------------------------------------------------------
chip_advisor_horizon:
  default_gws: 8
  max_extend_gws: 16
  structural_overlap_ceiling: 0.7
  spike_overlap_floor: 0.85
